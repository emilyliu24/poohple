<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pooh-ple 🍯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fdf3d0;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px 60px;
      color: #3b2a1a;
      position: relative;
      overflow-x: hidden;
    }

    /* ── background characters ── */
    .bg-chars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-char {
      position: absolute;
      font-size: 7rem;
      opacity: 0.13;
      user-select: none;
      filter: blur(0.5px);
    }
    .bg-char.pooh   { top: 6%;  left: 3%;  transform: rotate(-12deg); }
    .bg-char.piglet { top: 8%;  right: 4%; transform: rotate(10deg); font-size: 5.5rem; }
    .bg-char.eeyore { bottom: 10%; left: 2%;  transform: rotate(8deg);  font-size: 6rem; }
    .bg-char.tigger { bottom: 8%;  right: 3%; transform: rotate(-8deg); font-size: 6.5rem; }

    /* ── main content above bg ── */
    header, #start-screen, #game-area, #win-overlay { position: relative; z-index: 1; }

    header {
      text-align: center;
      margin-bottom: 22px;
    }
    header .honey { font-size: 2.4rem; margin-bottom: 2px; }
    header h1 {
      font-size: 2.8rem;
      color: #c47a1e;
      letter-spacing: 3px;
      text-shadow: 1px 2px 0 #f0d090;
    }
    header p { margin-top: 5px; font-size: 0.92rem; color: #7a5c38; }

    /* ── start screen ── */
    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 320px;
      text-align: center;
    }

    .start-card {
      background: #fff8e8;
      border: 2px solid #e8b94a;
      border-radius: 16px;
      padding: 24px 30px;
      width: 100%;
    }

    .start-card .label {
      font-size: 0.8rem;
      color: #b0906a;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .start-card .daily-word {
      font-size: 2.4rem;
      letter-spacing: 10px;
      font-weight: bold;
      color: #3b2a1a;
      background: #fce8a0;
      border: 2px solid #e8b94a;
      border-radius: 10px;
      padding: 8px 10px 8px 20px;
      margin-bottom: 10px;
    }

    .start-card .sub {
      font-size: 0.82rem;
      color: #9a7050;
    }

    #start-btn {
      background: #c47a1e;
      color: #fff;
      font-weight: bold;
      padding: 14px 44px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-family: 'Georgia', serif;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s, transform 0.1s;
    }
    #start-btn:hover  { background: #a8640f; }
    #start-btn:active { transform: scale(0.96); }

    /* ── target banner ── */
    .target-banner {
      background: #fce8a0;
      border: 2px solid #e8b94a;
      border-radius: 12px;
      padding: 8px 20px;
      margin-bottom: 18px;
      font-size: 0.95rem;
      color: #7a5c38;
      text-align: center;
    }
    .target-banner strong { color: #c47a1e; font-size: 1.2rem; letter-spacing: 4px; }

    /* ── history ── */
    #history {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
      max-height: 340px;
      overflow-y: auto;
    }

    .history-row {
      display: flex;
      gap: 7px;
      justify-content: center;
      align-items: center;
    }

    .history-row .step-num {
      width: 22px;
      font-size: 0.75rem;
      color: #b0906a;
      text-align: right;
      flex-shrink: 0;
    }

    .letter-box {
      width: 56px; height: 56px;
      border: 2px solid #d4a85a;
      border-radius: 8px;
      background: #fff9ee;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #3b2a1a;
    }
    .letter-box.changed { border-color: #c47a1e; background: #fce8a0; }
    .letter-box.start   { border-color: #a8c4e0; background: #eaf3fb; }
    .letter-box.win     { border-color: #5a9e5a; background: #d4f0d4; animation: pop 0.4s ease; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    /* ── word input area ── */
    #input-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    #tile-input-row {
      display: flex;
      gap: 8px;
    }

    #tile-input-row.shake { animation: shake 0.35s ease; }

    .tile-input {
      width: 58px; height: 58px;
      border: 2px solid #d4a85a;
      border-radius: 8px;
      background: #fff9ee;
      font-size: 1.9rem;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      color: #3b2a1a;
      font-family: 'Georgia', serif;
      outline: none;
      caret-color: transparent;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }
    .tile-input:focus {
      border-color: #c47a1e;
      box-shadow: 0 0 0 3px rgba(196,122,30,0.2);
    }
    .tile-input.filled { border-color: #c47a1e; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }

    #message {
      min-height: 22px;
      font-size: 0.88rem;
      color: #b03030;
      text-align: center;
    }
    #message.good { color: #3a7a3a; }

    .btn-row {
      display: flex; gap: 10px; margin-top: 2px;
    }

    button {
      padding: 10px 22px;
      border: none; border-radius: 8px;
      font-size: 1rem; font-family: 'Georgia', serif;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    button:active { transform: scale(0.96); }

    #enter-btn {
      background: #c47a1e; color: #fff;
      font-weight: bold; letter-spacing: 1px;
    }
    #enter-btn:hover { background: #a8640f; }

    #reset-btn {
      background: #e0d0b0; color: #5a3e20;
    }
    #reset-btn:hover { background: #c8b898; }

    .hint {
      font-size: 0.76rem; color: #b0906a;
      margin-top: 6px; text-align: center;
    }

    /* ── win overlay ── */
    #win-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      align-items: center; justify-content: center;
      z-index: 200;
    }
    #win-overlay.show { display: flex; }

    .win-card {
      background: #fdf6e3;
      border: 3px solid #e8b94a;
      border-radius: 20px;
      padding: 32px 36px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      animation: slideUp 0.35s ease;
      position: relative; z-index: 201;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .win-card .w-emoji  { font-size: 3rem; }
    .win-card h2        { font-size: 1.7rem; color: #c47a1e; margin: 8px 0 4px; }
    .win-card .your-steps {
      font-size: 1.1rem; color: #3b2a1a; margin-bottom: 4px;
    }
    .win-card .best-steps {
      font-size: 0.85rem; color: #7a5c38;
      background: #fce8a0; border: 1.5px solid #e8b94a;
      border-radius: 8px; padding: 6px 12px;
      margin: 8px auto 14px;
      display: inline-block;
    }
    .win-card .path-display {
      font-size: 0.78rem; color: #9a7050; margin-bottom: 16px;
      word-break: break-all;
    }

    #play-again-btn {
      background: #c47a1e; color: #fff;
      font-weight: bold; padding: 10px 28px;
      border-radius: 8px; font-size: 1rem;
    }
    #play-again-btn:hover { background: #a8640f; }

    /* ── floating Pooh heads ── */
    .pooh-float {
      position: fixed;
      font-size: 2.8rem;
      z-index: 199;
      animation: floatUp 2.8s ease-out forwards;
      pointer-events: none;
      user-select: none;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0)   rotate(0deg);   opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(-85vh) rotate(20deg); opacity: 0; }
    }

    #game-area { width: 100%; max-width: 340px; }
  </style>
</head>
<body>

<!-- background characters -->
<div class="bg-chars">

  <div class="bg-char piglet">🐷</div>
  <div class="bg-char eeyore">🫏</div>

</div>

<!-- header -->
<header>
  <div class="honey">🍯</div>
  <h1>Pooh-ple</h1>
  <p>Change one letter at a time to reach <strong>POOH</strong></p>
</header>

<!-- start screen -->
<div id="start-screen">
  <div class="start-card">
    <div class="label">Today's starting word</div>

<!-- game area -->
<div id="game-area" style="display:none;">

  <div id="input-area">
    <div id="tile-input-row">
      <input class="tile-input" maxlength="1" data-idx="0" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="characters" />
      <input class="tile-input" maxlength="1" data-idx="1" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="characters" />
      <input class="tile-input" maxlength="1" data-idx="2" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="characters" />

      <button id="enter-btn" onclick="submitWord()">Enter ↵</button>

</div>

<!-- win overlay -->

    <div class="best-steps" id="best-steps-text"></div>
    <div class="path-display" id="path-display"></div>
    <button id="play-again-btn" onclick="resetGame()">Play Again</button>
  </div>
</div>

<script>
// ─── word list ────────────────────────────────────────────────────────────────

// ─── daily starting words ─────────────────────────────────────────────────────
const DAILY_WORDS = [
  'BOLD','HOOP','TONE','COOK','WOOL','GONE','LOOT','PANE','BONE',
  'WAND','HIVE','MOLD','BOON','FOLD','GAZE','TOOT','SILK','NOON',
  'RAKE','HOOD','TOLL','MINE','BOOK','SORE','WINK','LOON','CAVE',
  'POLL','GOOD','ZINC','HOOT','SOLE','BAND','ZOOM','BORE','PINK',
  'SOLD','MOON','FLAP','HOOD','GATE','COOL','DUSK','PORE','WING',
  'TOLD','BOOP','LIME','ROOT','FAME','GOLD','WOKE','SOOT','JOLT',
  'HONE','GOOP','RIDE','LORE','FAWN','POOL','HEMP','CORE','BASK',
  'NONE','LOOP','TIDE','FORE','MILD','WOOD','BULK','GORE','TEAL',
  'LONE','HOOP','RISK','MORE','KEEN','MOOD','GRIP','POOF','DARK',
  'DONE','FOOL','DRAB','WORE','LAST','FOOD','ZINC','CONE','MILK',
  'ZONE','TOOL','GUST','LOOT','SAGE','NOOK','WELT','HOOT','BILE',
  'POOR','WOOL','DUNE','SOOT','LAMP','LOOK','HELM','TOOT','GALE',
];

// ─── BFS shortest path ────────────────────────────────────────────────────────
function bfsShortestStepsFix(start) {
  const target = 'POOH';
  if (start === target) return 0;
  const queue = [[start, 0]];
  const visited = new Set([start]);
  while (queue.length) {
    const [word, dist] = queue.shift();
    for (let i = 0; i < 4; i++) {
      for (let c = 65; c <= 90; c++) {
        if (word.charCodeAt(i) === c) continue;
        const next = word.substring(0, i) + String.fromCharCode(c) + word.substring(i + 1);
        if (!visited.has(next) && WORD_LIST.has(next.toLowerCase())) {
          if (next === target) return dist + 1;
          visited.add(next);
          queue.push([next, dist + 1]);
        }
      }
    }
  }
  return null;
}

// ─── state ────────────────────────────────────────────────────────────────────
const TARGET = 'POOH';
let currentWord     = '';
let history         = [];
let dailyWord       = '';
let fastestPossible = null;

// ─── init ─────────────────────────────────────────────────────────────────────
(function init() {
  const day = Math.floor(Date.now() / 86400000);
  dailyWord = DAILY_WORDS[day % DAILY_WORDS.length];
  document.getElementById('daily-word-display').textContent = dailyWord;
})();

// ─── tile input setup ─────────────────────────────────────────────────────────
const tiles = Array.from(document.querySelectorAll('.tile-input'));

tiles.forEach((tile, idx) => {
  tile.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitWord(); return; }

    if (e.key === 'Backspace') {
      e.preventDefault();
      if (tile.value) {
        tile.value = '';
        tile.classList.remove('filled');
      } else if (idx > 0) {
        tiles[idx - 1].value = '';
        tiles[idx - 1].classList.remove('filled');
        tiles[idx - 1].focus();
      }
      return;
    }

    if (e.key === 'ArrowLeft')  { e.preventDefault(); if (idx > 0) tiles[idx - 1].focus(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (idx < 3) tiles[idx + 1].focus(); return; }

    if (/^[a-zA-Z]$/.test(e.key)) {
      e.preventDefault();
      tile.value = e.key.toUpperCase();
      tile.classList.add('filled');
      if (idx < 3) tiles[idx + 1].focus();
    }
  });

  // handle mobile keyboard / input event as fallback
  tile.addEventListener('input', () => {
    const v = tile.value.replace(/[^a-zA-Z]/g, '').slice(-1).toUpperCase();
    tile.value = v;
    if (v) {
      tile.classList.add('filled');
      if (idx < 3) tiles[idx + 1].focus();
    } else {
      tile.classList.remove('filled');
    }
  });

  tile.addEventListener('focus', () => tile.select());
});

// ─── start game ───────────────────────────────────────────────────────────────
function startGame() {
  currentWord     = dailyWord;
  history         = [{ word: dailyWord, isStart: true }];
  fastestPossible = bfsShortestStepsFix(dailyWord);

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-area').style.display    = 'block';

  renderHistory();
  clearTiles();
  tiles[0].focus();
  setMessage('');
}

function clearTiles() {
  tiles.forEach(t => { t.value = ''; t.classList.remove('filled'); });
}

// ─── render history ───────────────────────────────────────────────────────────
function renderHistory() {
  const el = document.getElementById('history');
  el.innerHTML = '';
  history.forEach((entry, i) => {
    const row = document.createElement('div');
    row.className = 'history-row';

    const num = document.createElement('span');
    num.className = 'step-num';
    num.textContent = i === 0 ? '★' : i;
    row.appendChild(num);

    entry.word.split('').forEach((letter, li) => {
      const box = document.createElement('div');
      box.className = 'letter-box';
      box.textContent = letter;

      if (entry.isStart) {
        box.classList.add('start');
      } else if (entry.isWin) {
        box.classList.add('win');
      } else {
        // highlight letters that match TARGET positionally
        if (letter === TARGET[li]) box.classList.add('changed');
      }
      row.appendChild(box);
    });

    el.appendChild(row);
  });
  el.scrollTop = el.scrollHeight;
}

// ─── submit ───────────────────────────────────────────────────────────────────
function submitWord() {
  const typed = tiles.map(t => t.value.toUpperCase()).join('');

  if (typed.length !== 4 || typed.includes(' ') || !/^[A-Z]{4}$/.test(typed)) {
    showError('Fill in all 4 boxes first!');
    return;
  }

  let diffCount = 0;
  for (let i = 0; i < 4; i++) {
    if (typed[i] !== currentWord[i]) diffCount++;
  }

  if (diffCount === 0) {
    showError("That's the same word — change one letter!");
    return;
  }
  if (diffCount > 1) {
    showError('Only ONE letter can change per guess.');
    return;
  }

  if (typed !== 'POOH' && !WORD_LIST.has(typed.toLowerCase())) {
    showError(`"${typed}" isn't a word we recognise. Try another!`);
    return;
  }

  // accept
  const isWin = typed === 'POOH';
  currentWord = typed;
  history.push({ word: typed, isWin });
  renderHistory();
  clearTiles();
  setMessage('');

  if (isWin) {
    setTimeout(triggerWin, 250);
  } else {
    tiles[0].focus();
  }
}

function showError(msg) {
  setMessage(msg);
  const row = document.getElementById('tile-input-row');
  row.classList.remove('shake');
  void row.offsetWidth;
  row.classList.add('shake');
  setTimeout(() => row.classList.remove('shake'), 400);
}

// ─── win ──────────────────────────────────────────────────────────────────────
function triggerWin() {
  launchPoohHeads();
  const steps = history.length - 1;
  document.getElementById('your-steps-text').textContent =
    `You got there in ${steps} ${steps === 1 ? 'step' : 'steps'}! 🎉`;
  document.getElementById('best-steps-text').textContent =
    fastestPossible !== null
      ? `⚡ Fastest possible from ${dailyWord}: ${fastestPossible} ${fastestPossible === 1 ? 'step' : 'steps'}`
      : `⚡ Fastest possible: unknown`;
  document.getElementById('path-display').textContent =
    history.map(e => e.word).join(' → ');
  document.getElementById('win-overlay').classList.add('show');
}

// ─── floating Pooh heads ──────────────────────────────────────────────────────
function launchPoohHeads() {
  const emojis = ['🐻','🍯','🐻','🍯','🐻','🌟','🐝','🍯'];
  for (let i = 0; i < 20; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'pooh-float';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left   = Math.random() * 90 + 5 + 'vw';
      el.style.bottom = '0';
      el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      el.style.fontSize = (2 + Math.random() * 2) + 'rem';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }, i * 120);
  }
}

// ─── reset ────────────────────────────────────────────────────────────────────
function resetGame() {
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('game-area').style.display    = 'none';
  document.getElementById('start-screen').style.display = 'flex';
  document.getElementById('history').innerHTML = '';
  clearTiles();
  setMessage('');
}

function setMessage(msg) {
  document.getElementById('message').textContent = msg;
}
</script>
</body>
</html>
